name: Build & Upload Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build firmware with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32s3
          path: Code
          command: idf.py -DPROJECT_VER="${{ github.event.release.tag_name }}" build

      - name: Rename binaries
        run: |
          cp Code/build/Code.bin Code/build/esp-rc-car.bin
          cp Code/build/littlefs.bin Code/build/esp-rc-car-littlefs.bin

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Code/build/esp-rc-car.bin
            Code/build/esp-rc-car-littlefs.bin
